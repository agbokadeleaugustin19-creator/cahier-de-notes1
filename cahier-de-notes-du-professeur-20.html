if(SA&&!ONLINE)D.warnB=["Vos classes sont enregistrées uniquement dans ce navigateur, sur cet appareil. Utilisez toujours le même navigateur, ne supprimez pas ses données et faites une copie de sécurité chaque semaine pour pouvoir restaurer vos classes.","Your classes are stored only in this browser, on this device. Always use the same browser, do not clear its data and make a backup every week so you can restore your classes.","Your classes are stored only in this browser, on this device. Always use the same browser, do not clear its data and make a backup every week so you can restore your classes.","Ihre Klassen werden nur in diesem Browser auf diesem Gerät gespeichert. Verwenden Sie immer denselben Browser, löschen Sie dessen Daten nicht und erstellen Sie jede Woche eine Sicherungskopie, um Ihre Klassen wiederherstellen zu können.","Sus clases se guardan solo en este navegador, en este dispositivo. Use siempre el mismo navegador, no borre sus datos y haga una copia de seguridad cada semana para poder restaurar sus clases."];
const BKL={"fr": ["Matière", "Coefficient", "Établissement", "Professeur", "Effectif", "Moyenne de la classe", "Réussite", "Copie de sécurité", "DONNÉES POUR LA RESTAURATION (ne pas modifier ce bloc)", "Rang", "Nom et prénoms", "Sexe", "Moyenne"], "en": ["Subject", "Coefficient", "School", "Teacher", "Headcount", "Class average", "Success rate", "Backup copy", "DATA FOR RESTORATION (do not edit this block)", "Rank", "Student name", "Sex", "Average"], "de": ["Fach", "Koeffizient", "Schule", "Lehrkraft", "Anzahl", "Klassendurchschnitt", "Bestehensquote", "Sicherung", "DATEN FÜR DIE WIEDERHERSTELLUNG (diesen Block nicht ändern)", "Rang", "Name des Schülers", "Geschl.", "Durchschnitt"], "es": ["Asignatura", "Coeficiente", "Centro", "Profesor", "Efectivo", "Promedio de la clase", "Tasa de aprobados", "Copia de seguridad", "DATOS PARA LA RESTAURACIÓN (no modificar este bloque)", "Puesto", "Nombre del alumno", "Sexo", "Promedio"], "yo": ["Ẹ̀kọ́", "Òǹkà ìwúwo", "Ilé-ẹ̀kọ́", "Olùkọ́", "Iye àpapọ̀", "Ìpíndọ́gba kíláàsì", "Ìpín àṣeyọrí", "Ẹ̀dà ìpamọ́", "DÁTÀ FÚN ÌDÁPADÀ (má yí àkójọ yìí padà)", "Ipò", "Orúkọ akẹ́kọ̀ọ́", "Ìbálòpọ̀", "Ìpíndọ́gba"]};
const GX={"en": ["On the home screen tap <b>+ New class</b>. Enter the class name (required), the teacher and the school, then tap <b>Create class</b>.", "In the class, check the subject, choose the <b>semester</b> and the coefficient, then the school and the teacher.", "Tap <b>+ Add a student</b> and type the name, or <b>Paste a list of names</b> (one per line). Students sort alphabetically. Sex (G or F) is filled in when the first name is recognised; you can correct it. Choose N (new) or R (repeater).", "Marks from 0 to 20 (comma or dot). <b>An empty box is not a zero</b>: it is ignored. If the student scored zero, type 0. Everything is calculated live.", "<b>MEPE</b> = average of the entered tests. <b>Semester average</b> = average of the MEPE and the entered homework. <b>Rank</b> = descending order of averages. <b>Success rate</b> = % of students with 10 or more. Green: 10 or more; red: below 10. <b>Weighted average</b> = semester average × the subject's coefficient (e.g. 11.56 × 2 = 23.12).", "Choose 1st or 2nd semester: the table shows that semester's marks. The other semester's marks are kept separately. Always check the semester before typing.", "Tick <b>Abandon</b> at the end of the row. The student is no longer counted in averages, rank or success rate, but stays in the headcount. Untick to restore.", "Type a name in the search bar (accents and capitals are ignored). <b>Sort A → Z</b> sorts by name, <b>Sort by average</b> from best to lowest.", "Below the table, the <b>class summary</b> gives headcount, boys and girls, who passed or not (10/20), averages and success rate. The <b>summary per evaluation</b> shows, for each evaluation, how many were marked, average, highest, lowest and success rate.", "Tap <b>Download the ranking (PDF)</b>. The PDF ranks from best to lowest (girls in red, boys in black) and includes both summaries. If it fails, a panel offers « Open the PDF » and « Copy as text ».", "In each class, the green message shows when the data was last saved. <b>Lock the class</b> to protect it from accidental changes. <b>Backup</b>: tap it, then <b>Copy</b>, and paste the text in your Notes every week. <b>Restore a copy</b>: paste the text and tap <b>Restore</b>.", "<b>Class</b>: tap the bin 🗑, then <b>Yes, delete</b> or <b>No, cancel</b>. <b>Student</b>: tap ✕ <b>twice</b>; the first tap asks for confirmation, the second removes the student.", "<b>Missing classes</b>: use Restore a copy. <b>No average</b>: no marks entered, or student abandoned. <b>Student not found</b>: clear the search bar. <b>Marks missing</b>: check the semester. <b>Nothing changes</b>: the class may be locked.", "<b>Your classes are stored in this browser, on this device.</b> Do not clear the browser data without a backup, and make a backup every week. If the phone is lost or reset without a backup, the data is lost."], "de": ["Tippen Sie auf der Startseite auf <b>+ Neue Klasse</b>. Geben Sie Klassenname (erforderlich), Lehrkraft und Schule ein und tippen Sie auf <b>Klasse erstellen</b>.", "Prüfen Sie in der Klasse das Fach, wählen Sie das <b>Halbjahr</b> und den Koeffizienten, dann Schule und Lehrkraft.", "Tippen Sie auf <b>+ Schüler hinzufügen</b> und schreiben Sie den Namen, oder auf <b>Namensliste einfügen</b> (ein Name pro Zeile). Die Schüler werden alphabetisch sortiert. Das Geschlecht (G oder F) wird ausgefüllt, wenn der Vorname erkannt wird; Sie können es korrigieren. Wählen Sie N (neu) oder R (Wiederholer).", "Noten von 0 bis 20 (Komma oder Punkt). <b>Ein leeres Feld ist keine Null</b>: Es wird ignoriert. Hat der Schüler null erreicht, geben Sie 0 ein. Alles wird live berechnet.", "<b>MEPE</b> = Durchschnitt der eingegebenen Tests. <b>Halbjahresdurchschnitt</b> = Durchschnitt aus MEPE und eingegebenen Hausaufgaben. <b>Rang</b> = absteigende Reihenfolge der Durchschnitte. <b>Bestehensquote</b> = % der Schüler mit 10 oder mehr. Grün: 10 oder mehr; rot: unter 10. <b>Gewichteter Durchschnitt</b> = Halbjahresdurchschnitt × Koeffizient des Fachs (z. B. 11,56 × 2 = 23,12).", "Wählen Sie 1. oder 2. Halbjahr: Die Tabelle zeigt die Noten dieses Halbjahres. Die Noten des anderen Halbjahres bleiben getrennt gespeichert. Prüfen Sie das Halbjahr immer vor der Eingabe.", "Setzen Sie am Zeilenende den Haken bei <b>Abbruch</b>. Der Schüler zählt nicht mehr bei Durchschnitten, Rang und Bestehensquote, bleibt aber in der Anzahl. Haken entfernen, um ihn wieder aufzunehmen.", "Geben Sie einen Namen in die Suchleiste ein (Akzente und Großschreibung werden ignoriert). <b>Sortieren A → Z</b> sortiert nach Namen, <b>Nach Durchschnitt sortieren</b> vom Besten zum Schwächsten.", "Unter der Tabelle zeigt die <b>Klassenübersicht</b> Anzahl, Jungen und Mädchen, wer bestanden hat oder nicht (10/20), Durchschnitte und Bestehensquote. Die <b>Übersicht je Bewertung</b> zeigt je Bewertung Anzahl, Durchschnitt, höchste und niedrigste Note und Bestehensquote.", "Tippen Sie auf <b>Rangliste herunterladen (PDF)</b>. Das PDF ordnet vom Besten zum Schwächsten (Mädchen rot, Jungen schwarz) und enthält beide Übersichten. Falls es scheitert, bietet ein Fenster « PDF öffnen » und « Als Text kopieren ».", "In jeder Klasse zeigt die grüne Meldung, wann zuletzt gespeichert wurde. <b>Klasse sperren</b> schützt vor versehentlichen Änderungen. <b>Sicherung</b>: antippen, dann <b>Kopieren</b> und den Text jede Woche in Ihre Notizen einfügen. <b>Sicherung wiederherstellen</b>: Text einfügen und <b>Wiederherstellen</b> tippen.", "<b>Klasse</b>: Papierkorb 🗑 tippen, dann <b>Ja, löschen</b> oder <b>Nein, abbrechen</b>. <b>Schüler</b>: ✕ <b>zweimal</b> tippen; das erste Tippen fragt nach, das zweite entfernt den Schüler.", "<b>Klassen fehlen</b>: Sicherung wiederherstellen. <b>Kein Durchschnitt</b>: keine Noten eingegeben oder Schüler ausgeschieden. <b>Schüler nicht gefunden</b>: Suchleiste leeren. <b>Noten fehlen</b>: Halbjahr prüfen. <b>Nichts ändert sich</b>: Die Klasse ist evtl. gesperrt.", "<b>Ihre Klassen werden in diesem Browser auf diesem Gerät gespeichert.</b> Löschen Sie die Browserdaten nicht ohne Sicherung und erstellen Sie jede Woche eine Sicherung. Bei Verlust oder Zurücksetzen des Telefons ohne Sicherung gehen die Daten verloren."], "es": ["En la pantalla de inicio toque <b>+ Nueva clase</b>. Escriba el nombre de la clase (obligatorio), el profesor y el centro, y toque <b>Crear la clase</b>.", "En la clase, compruebe la asignatura, elija el <b>semestre</b> y el coeficiente, luego el centro y el profesor.", "Toque <b>+ Añadir un alumno</b> y escriba el nombre, o <b>Pegar una lista de nombres</b> (uno por línea). Los alumnos se ordenan alfabéticamente. El sexo (G o F) se rellena si se reconoce el nombre; puede corregirlo. Elija N (nuevo) o R (repetidor).", "Notas de 0 a 20 (coma o punto). <b>Una casilla vacía no es un cero</b>: se ignora. Si el alumno sacó cero, escriba 0. Todo se calcula en directo.", "<b>MEPE</b> = promedio de las pruebas introducidas. <b>Promedio semestral</b> = promedio de la MEPE y de los deberes introducidos. <b>Puesto</b> = orden descendente de los promedios. <b>Tasa de aprobados</b> = % de alumnos con 10 o más. Verde: 10 o más; rojo: menos de 10. <b>Promedio ponderado</b> = promedio semestral × coeficiente de la asignatura (p. ej. 11,56 × 2 = 23,12).", "Elija 1.er o 2.º semestre: la tabla muestra las notas de ese semestre. Las del otro semestre se guardan aparte. Compruebe siempre el semestre antes de escribir.", "Marque <b>Abandono</b> al final de la fila. El alumno deja de contar en promedios, puesto y tasa de aprobados, pero sigue en el efectivo. Desmarque para reincorporarlo.", "Escriba un nombre en la barra de búsqueda (se ignoran acentos y mayúsculas). <b>Ordenar A → Z</b> ordena por nombre, <b>Ordenar por promedio</b> del mejor al peor.", "Bajo la tabla, el <b>resumen de la clase</b> da el efectivo, chicos y chicas, quiénes aprueban o no (10/20), promedios y tasa de aprobados. El <b>resumen por evaluación</b> muestra, por evaluación, calificados, promedio, nota más alta y más baja y tasa de aprobados.", "Toque <b>Descargar la clasificación (PDF)</b>. El PDF ordena del mejor al peor (chicas en rojo, chicos en negro) e incluye ambos resúmenes. Si falla, un panel ofrece « Abrir el PDF » y « Copiar como texto ».", "En cada clase, el mensaje verde indica cuándo se guardó por última vez. <b>Bloquear la clase</b> la protege de cambios accidentales. <b>Copia de seguridad</b>: tóquela, luego <b>Copiar</b>, y pegue el texto en sus Notas cada semana. <b>Restaurar una copia</b>: pegue el texto y toque <b>Restaurar</b>.", "<b>Clase</b>: toque la papelera 🗑, luego <b>Sí, eliminar</b> o <b>No, cancelar</b>. <b>Alumno</b>: toque ✕ <b>dos veces</b>; el primer toque pide confirmación, el segundo retira al alumno.", "<b>Clases desaparecidas</b>: use Restaurar una copia. <b>Sin promedio</b>: no hay notas o el alumno abandonó. <b>Alumno no encontrado</b>: borre la barra de búsqueda. <b>Faltan notas</b>: compruebe el semestre. <b>Nada cambia</b>: la clase puede estar bloqueada.", "<b>Sus clases se guardan en este navegador, en este dispositivo.</b> No borre los datos del navegador sin una copia y haga una copia cada semana. Si el teléfono se pierde o se reinicia sin copia, los datos se pierden."], "yo": ["Lórí ojú-ìwé àkọ́kọ́, tẹ <b>+ Kíláàsì tuntun</b>. Kọ orúkọ kíláàsì (dandan), olùkọ́ àti ilé-ẹ̀kọ́, lẹ́yìn náà tẹ <b>Ṣẹ̀dá kíláàsì</b>.", "Nínú kíláàsì, ṣàyẹ̀wò ẹ̀kọ́, yan <b>sẹ́mẹ́sítà</b> àti òǹkà ìwúwo, lẹ́yìn náà ilé-ẹ̀kọ́ àti olùkọ́.", "Tẹ <b>+ Fi akẹ́kọ̀ọ́ kún</b> kí o sì kọ orúkọ, tàbí <b>Lẹ àtòjọ orúkọ</b> (orúkọ kan lórí ìlà kọ̀ọ̀kan). Àwọn akẹ́kọ̀ọ́ yóò tò ní ìlànà alfabẹ́ẹ̀tì. Ìbálòpọ̀ (G tàbí F) yóò farahàn fúnra rẹ̀ tí a bá mọ orúkọ náà; o lè tún un ṣe. Yan N (tuntun) tàbí R (ẹni tó ń tún ọdún ṣe).", "Máàkì láti 0 sí 20 (kọ́mà tàbí ààmì ìdánudúró). <b>Àpótí òfo kì í ṣe odo</b>: a kò kà á. Bí akẹ́kọ̀ọ́ bá gba odo, kọ 0. Gbogbo rẹ̀ ni a ń ṣírò lójúkan náà.", "<b>MEPE</b> = ìpíndọ́gba àwọn EPE tí a kọ. <b>Ìpíndọ́gba sẹ́mẹ́sítà</b> = ìpíndọ́gba MEPE àti iṣẹ́ àmúrelé tí a kọ. <b>Ipò</b> = ìtò àwọn ìpíndọ́gba láti òkè dé ìsàlẹ̀. <b>Ìpín àṣeyọrí</b> = ìpín ọgọ́rùn-ún àwọn akẹ́kọ̀ọ́ tó ní 10 tàbí jù bẹ́ẹ̀ lọ. Aláwọ̀ ewé: 10 tàbí jù; pupa: kéré sí 10. <b>Ìpíndọ́gba onípele</b> = ìpíndọ́gba sẹ́mẹ́sítà × òǹkà ìwúwo ẹ̀kọ́ náà (àpẹẹrẹ 11,56 × 2 = 23,12).", "Yan Sẹ́mẹ́sítà 1 tàbí 2: tábìlì yóò fi máàkì sẹ́mẹ́sítà yẹn hàn. A tọ́jú máàkì sẹ́mẹ́sítà kejì sọ́tọ̀. Máa ṣàyẹ̀wò sẹ́mẹ́sítà nígbà gbogbo kí o tó kọ nǹkan.", "Fi àmì sí <b>Ìfisílẹ̀</b> ní ìparí ìlà rẹ̀. A kò ní kà akẹ́kọ̀ọ́ náà mọ́ nínú ìpíndọ́gba, ipò àti ìpín àṣeyọrí, ṣùgbọ́n ó wà nínú iye àpapọ̀. Yọ àmì náà kúrò láti dá a padà.", "Kọ orúkọ sínú àpótí ìwádìí (a kò ka àmì ohùn àti lẹ́tà ńlá). <b>Tò A → Z</b> ń tò ní orúkọ, <b>Tò nípa ìpíndọ́gba</b> láti ẹni tó dára jù dé ẹni tó kéré jù.", "Lábẹ́ tábìlì, <b>Àkópọ̀ kíláàsì</b> fi iye àpapọ̀, ọkùnrin àti obìnrin, àwọn tó yege àti àwọn tí kò yege (10 nínú 20), ìpíndọ́gba àti ìpín àṣeyọrí hàn. <b>Àkópọ̀ nípa ìdánwò</b> fi iye àwọn tí a fún ní máàkì, ìpíndọ́gba, máàkì tó ga jù àti tó kéré jù, àti ìpín àṣeyọrí hàn fún ìdánwò kọ̀ọ̀kan.", "Tẹ <b>Gba ìtòlẹ́sẹẹsẹ (PDF)</b>. PDF yóò tò láti ẹni tó dára jù dé ẹni tó kéré jù (obìnrin ní pupa, ọkùnrin ní dúdú), yóò sì ní àkópọ̀ méjèèjì. Tí ó bá kùnà, a ó rí àpótí tó ní « Ṣí PDF » àti « Dà kọ gẹ́gẹ́ bí ọ̀rọ̀ ».", "Nínú kíláàsì kọ̀ọ̀kan, ìfiránṣẹ́ aláwọ̀ ewé fi ìgbà tí a kọ́kọ́ fi pamọ́ gbẹ̀yìn hàn. <b>Tì kíláàsì</b> láti dáàbò bò ó lọ́wọ́ àyípadà àìròtẹ́lẹ̀. <b>Ẹ̀dà ìpamọ́</b>: tẹ̀ ẹ́, lẹ́yìn náà <b>Dà kọ</b>, kí o sì lẹ ọ̀rọ̀ náà sínú Notes rẹ ní ọ̀sẹ̀ kọ̀ọ̀kan. <b>Dá ẹ̀dà padà</b>: lẹ ọ̀rọ̀ náà kí o sì tẹ <b>Dá padà</b>.", "<b>Kíláàsì</b>: tẹ àpótí ìdọ̀tí 🗑, lẹ́yìn náà <b>Bẹ́ẹ̀ni, pa á rẹ́</b> tàbí <b>Rárá, fagilé</b>. <b>Akẹ́kọ̀ọ́</b>: tẹ ✕ <b>lẹ́ẹ̀mejì</b>; ìtẹ̀ àkọ́kọ́ ń béèrè ìdánilójú, ìkejì ń yọ akẹ́kọ̀ọ́ náà kúrò.", "<b>Kíláàsì tó sọnù</b>: lo Dá ẹ̀dà padà. <b>Kò sí ìpíndọ́gba</b>: kò sí máàkì tí a kọ, tàbí akẹ́kọ̀ọ́ náà ti fi sílẹ̀. <b>A kò rí akẹ́kọ̀ọ́</b>: pa àpótí ìwádìí rẹ́. <b>Máàkì sọnù</b>: ṣàyẹ̀wò sẹ́mẹ́sítà. <b>Kò sí ohun tó ń yípadà</b>: kíláàsì náà lè wà ní títì.", "<b>A tọ́jú àwọn kíláàsì rẹ sínú aṣàwákiri yìí, lórí ẹ̀rọ yìí.</b> Má ṣe pa dátà aṣàwákiri rẹ́ láìsí ẹ̀dà ìpamọ́, kí o sì ṣe ẹ̀dà ìpamọ́ ní ọ̀sẹ̀ kọ̀ọ̀kan. Bí a bá pàdánù fóònù tàbí tí a tún un tò láìsí ẹ̀dà ìpamọ́, dátà yóò sọnù."]};

plication (soutien) se fait uniquement par dépôt sur les deux numéros d’ADA (MTN MoMo 01 67 82 97 51 ou WhatsApp +2290144097073), et sur aucun autre numéro. Cloche « 🔔 Notifications » sur l’accueil des comptes utilisateurs (non affichée pour le compte administrateur), avec un chiffre rouge indiquant le nombre de notifications non lues ; les notifications sont rechargées à chaque connexion ; ouverte, la cloche affiche les notifications et les marque comme lues. Bouton « ↻ Actualiser » sur l’écran des notifications et dans l’espace administrateur (au-dessus de la liste des notifications envoyées) pour recharger les données sans quitter l’écran. Dans l’espace administrateur, la liste des notifications envoyées permet à l’administrateur de supprimer une notification (pour tous les destinataires) à volonté. Bouton « 🛠 Espace administrateur » visible seulement pour le compte administrateur (deleaugustinagboka3@gmail.com) : il permet d’envoyer une notification à tous les comptes, ou seulement à des comptes cochés dans la liste des destinataires (titre, message, case « Tous les comptes » ou sélection individuelle). Chaque compte connecté est inscrit dans un répertoire visible seulement par l’administrateur. Chaque compte est inscrit à chaque ouverture de l’application. Un bouton 🗑 à côté de chaque compte le retire du répertoire et supprime ses notifications (le compte Firebase lui-même se supprime dans la console Firebase). Le mot de passe de l’administrateur n’est jamais écrit dans l’application.\n\nDONNÉES ET CLASSES\n- Données séparées par compte (clé locale cm_v1_<id>) et sauvegardées dans le cloud ; seules les classes modifiées sont envoyées et téléchargées (chaque classe porte un numéro de version, et l’enregistrement de contrôle garde la liste des versions). Le mot « synchroniser » n'est jamais utilisé. États : « ☁ Données sauvegardées », « ☁ Sauvegarde… », « 📱 Sur cet appareil seulement », « ⚠ Sauvegarde impossible ».\n- À la création d'une classe : nom de la classe
